[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]

[project]
name = "newclid"
authors = [
    {name = "Mathis Federico", email = "mathfederico@gmail.com"},
    {name = "Vladmir Sicca", email = "vsiccag@gmail.com"},
    {name = "Tianxiang Xia", email = "xia.tianxiang00@gmail.com"}
]
dynamic = ["version", "readme"]
description = "Symbolic solver for geometric problems."
requires-python = ">=3.6"
classifiers=[
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Topic :: Software Development',
    'Topic :: Scientific/Engineering',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]

# Core dependencies - only what's needed for pure engine inference
dependencies = [
    "numpy>=1.23.5,<2.0",
    "scipy>=1.10.0",
    "typing-extensions",
    "networkx",
    "pybind11",
    "colorama",
    "rich",
]

[project.optional-dependencies]
# Visualization
viz = [
    "matplotlib>=3.7.0",
    "pyvis",
    "seaborn",
    "pillow",
    "cairosvg",
    "adjustText",
]

# Data generation (Ray parallel)
generation = [
    "ray[default]",
    "millify",
    "newclid[viz]",
]

# ML/LLM inference
ml = [
    "torch",
    "torchvision",
    "transformers>=4.40.0",
    "accelerate",
    "ray[default]",
    "newclid[viz]",
]

# VLM specific
vlm = [
    "qwen_vl_utils",
    "modelscope",
    "timm",
    "newclid[ml]",
]

# OpenAI API
openai = ["openai"]

# Full installation (backward compatible)
full = [
    "newclid[viz]",
    "newclid[generation]",
    "newclid[ml]",
    "newclid[vlm]",
    "newclid[openai]",
    "py-data-juicer",
]

dev = ['black', 'ruff', 'pytest', 'pytest-cov', 'pytest-check', 'pytest-mock', 'pre-commit']
doc = ['numpy', 'sphinx-autoapi', 'autoapi', 'sphinx_rtd_theme', 'sphinx-autodoc-typehints', 'sphinx-autobuild']

[tool.setuptools]
license-files = ['LICEN[CS]E*', 'COPYING*', 'NOTICE*', 'AUTHORS*']

[project.scripts]
newclid = "newclid.__main__:main"

[tool.setuptools.dynamic]
readme = { file = ["README.md"] }

[tool.setuptools_scm]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:distutils Version classes are deprecated:DeprecationWarning',
    'ignore:`np.bool8` is a deprecated alias for `np.bool_`:DeprecationWarning',
    'ignore:Training and eval env are not of the same type:UserWarning',
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ['src']

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",

    # Don't complain about typing imports, they aren't run:
    "if TYPE_CHECKING:",

    # Don't complain about optional imports, they don't matter for now:
    "except ImportError:"
]
